{% extends 'base.html' %}
{% block code %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">My Services</h2>
        <a href="{% url 'addservice' %}" class="btn btn-primary rounded-pill px-4">+ New Service</a>
    </div>

    <div class="row g-4">
        {% for service in services %}
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden h-100">
                {%if service.img %}
                <img src="{{service.img.url}}" class="card-img-top" style="height: 200px; object-fit: cover;">
                {% endif%}
                <div class="card-body">
                    <h5 class="fw-bold">{{ service.title }}</h5>
                    <p class="text-success fw-bold">AED {{ service.price }}</p>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-switch" type="checkbox" {% if service.is_available %}checked{% endif %}>
                        <label class="form-check-label small">Live on Site</label>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{%url 'updateservice' service.id %}" class="btn btn-sm btn-outline-secondary w-100">Edit</a>
                        
                        <br><a href="{%url 'deleteservice' service.id %}" onclick="return confirm('Do you want to remove this service?')" class="btn btn-sm btn-outline-danger w-100">Delete</a>
                        <a href="{% url 'addgallery' service.id %}" class="btn btn-sm btn-outline-primary flex-grow-1">Photos</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
