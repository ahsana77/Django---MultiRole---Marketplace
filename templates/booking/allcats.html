{% extends 'base.html' %}
{% block code %}
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold">All Services</h1>
        <p class="text-muted">Explore our wide range of professional services in Abu Dhabi</p>
    </div>

    <div class="row g-4 justify-content-center">
        {% for cat in categories %}
        <div class="col-6 col-md-3 col-lg-2">
            <a href="{% url 'catview' cat.id %}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm p-4 text-center rounded-4 category-card">
                    <div class="icon-box mb-3 mx-auto">
                        {% if cat.icon %}
                            <img src="{{ cat.icon.url }}" class="img-fluid" style="width: 45px;">
                        {% endif %}
                    </div>
                    <p class="small fw-bold text-dark mb-0">{{ cat.name }}</p>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .category-card {
        transition: all 0.3s ease;
        background-color: #f9f9f9;
    }
    .category-card:hover {
        background-color: #ffffff;
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important;
    }
    .icon-box {
        width: 70px;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        border-radius: 20px;
    }
</style>
{% endblock %}
