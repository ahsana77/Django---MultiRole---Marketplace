{% extends 'base.html' %}
{% block code %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 p-4 rounded-4">
                <h3 class="fw-bold mb-2">Create Account</h3>
                <p class="text-muted mb-4">Join our community of professionals and customers.</p>
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3">Register Now</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
}
