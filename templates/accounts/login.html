{% extends 'base.html' %}
{% block code %}
<div class="container-fluid vh-100 bg-light d-flex align-items-center justify-content-center">
    <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 900px; width: 100%;">
        <div class="row g-0">
            <div class="col-md-6 d-none d-md-block">
                <img src="/static/images/login2.jpg" 
                     class="h-100 w-100 object-fit-cover" alt="Service Login">
            </div>
            <div class="col-md-6 p-5 bg-white">
                <h3 class="fw-bold mb-3 text-primary">Servixa Login</h3>
                <p class="text-muted mb-4 small">Enter your credentials to access your schedule.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" name="uname" class="form-control form-control-lg" placeholder="Enter username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="psw" class="form-control form-control-lg" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Sign In</button>
                </form>
                
                <div class="mt-4 text-center">
                    <p class="small text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
