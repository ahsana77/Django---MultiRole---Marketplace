{% extends 'base.html' %}

{% block code %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Create New Offer</h2>
                    <p class="text-muted small">Fill in the details to launch a global promotion</p>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                            Publish Offer
                        </button>
                        <a href="{% url 'admin_dashboard' %}" class="btn btn-light rounded-pill fw-bold">
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
